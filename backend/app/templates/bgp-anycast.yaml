id: bgp-anycast
title: BGP anycast with FRR members
summary: Two Debian machines running FRR announce the same /32 (anycast) to the router over eBGP; the router spreads traffic over both (ECMP).
tags: [bgp, frr, anycast, ecmp, routing]
requires: [bgp]
resources: {vcpus: 3, memory_mb: 2560, disk_gb: 30}
params:
  - {name: case, label: Case number, type: string, required: true, pattern: '^[0-9a-z][0-9a-z-]{0,11}$'}
  - {name: cidr, label: Group subnet, type: cidr, default: auto, help: 'auto = the first free /24 of 10.42.0.0/16'}
  - {name: anycast_range, label: Announce range, type: cidr, default: 10.45.240.0/27,
     help: 'Prefix the router accepts from the members (outside the group subnet, unique on this host). The anycast address is its first address.'}
  - {name: remote_access, label: WireGuard remote access, type: bool, default: false,
     help: 'Laptop clients get a route to the announce range too'}
  - {name: password, label: Login password (user admin), type: string, default: lab12345}
name: "c{{case}}-bgp"
group:
  cidr: "{{cidr}}"
  router:
    bgp:
      enabled: true
      announce_ranges:
        - {prefix: "{{anycast_range}}", name: anycast}
    wireguard: {_if: remote_access, enabled: true}
    dns:
      records:
        - {name: service, a: "{{anycast_range:1}}"}
  cloud_init: {username: admin, password: "{{password}}"}
  members:
    - name: n1
      image: debian-13
      user_data: |
        #cloud-config
        hostname: n1
        fqdn: n1.{{domain}}
        manage_etc_hosts: true
        package_update: true
        packages: [qemu-guest-agent, frr, python3]
        users:
          - default
          - {name: admin, sudo: "ALL=(ALL) NOPASSWD:ALL", shell: /bin/bash, lock_passwd: false, plain_text_passwd: "{{password}}"}
        ssh_pwauth: true
        write_files:
          - path: /etc/vmm-frr.conf
            content: |
              frr defaults traditional
              hostname n1
              router bgp 64513
               no bgp ebgp-requires-policy
               neighbor {{ip:1}} remote-as 64512
               address-family ipv4 unicast
                network {{anycast_range:1}}/32
                network {{anycast_range:11}}/32
               exit-address-family
          - path: /etc/systemd/system/vmm-lo.service
            content: |
              [Unit]
              Before=frr.service
              [Service]
              Type=oneshot
              RemainAfterExit=yes
              ExecStart=/bin/sh -c 'for a in {{anycast_range:1}}/32 {{anycast_range:11}}/32; do ip address replace $a dev lo; done'
              [Install]
              WantedBy=multi-user.target
          - path: /etc/systemd/system/vmm-www.service
            content: |
              [Service]
              ExecStart=/usr/bin/python3 -m http.server 80 -d /srv/www
              [Install]
              WantedBy=multi-user.target
          - {path: /srv/www/index.html, content: "hello from n1\n"}
        runcmd:
          - [systemctl, enable, --now, qemu-guest-agent]
          - sed -i 's/^bgpd=no/bgpd=yes/' /etc/frr/daemons
          - install -o frr -g frr -m 640 /etc/vmm-frr.conf /etc/frr/frr.conf
          - systemctl daemon-reload
          - systemctl enable --now vmm-lo.service vmm-www.service
          - systemctl restart frr
    - name: n2
      image: debian-13
      user_data: |
        #cloud-config
        hostname: n2
        fqdn: n2.{{domain}}
        manage_etc_hosts: true
        package_update: true
        packages: [qemu-guest-agent, frr, python3]
        users:
          - default
          - {name: admin, sudo: "ALL=(ALL) NOPASSWD:ALL", shell: /bin/bash, lock_passwd: false, plain_text_passwd: "{{password}}"}
        ssh_pwauth: true
        write_files:
          - path: /etc/vmm-frr.conf
            content: |
              frr defaults traditional
              hostname n2
              router bgp 64513
               no bgp ebgp-requires-policy
               neighbor {{ip:1}} remote-as 64512
               address-family ipv4 unicast
                network {{anycast_range:1}}/32
                network {{anycast_range:12}}/32
               exit-address-family
          - path: /etc/systemd/system/vmm-lo.service
            content: |
              [Unit]
              Before=frr.service
              [Service]
              Type=oneshot
              RemainAfterExit=yes
              ExecStart=/bin/sh -c 'for a in {{anycast_range:1}}/32 {{anycast_range:12}}/32; do ip address replace $a dev lo; done'
              [Install]
              WantedBy=multi-user.target
          - path: /etc/systemd/system/vmm-www.service
            content: |
              [Service]
              ExecStart=/usr/bin/python3 -m http.server 80 -d /srv/www
              [Install]
              WantedBy=multi-user.target
          - {path: /srv/www/index.html, content: "hello from n2\n"}
        runcmd:
          - [systemctl, enable, --now, qemu-guest-agent]
          - sed -i 's/^bgpd=no/bgpd=yes/' /etc/frr/daemons
          - install -o frr -g frr -m 640 /etc/vmm-frr.conf /etc/frr/frr.conf
          - systemctl daemon-reload
          - systemctl enable --now vmm-lo.service vmm-www.service
          - systemctl restart frr
guide: |
  # Case {{case}}: BGP anycast (FRR) behind the lab router

  **Customer symptom (typical):** "Our anycast VIP only ever hits one node", "traffic is not balanced
  after a node comes back", or "routes from the node are refused by the router".

  ## What is in the lab
  - Router `{{ip:1}}` runs FRR, **AS 64512**, accepts sessions from the group network (AS 64513) and only
    routes inside **{{anycast_range}}** (`le 32`); ECMP over up to 8 paths
  - `n1` and `n2` (Debian + FRR, AS 64513) both announce the anycast address **{{anycast_range:1}}**, plus
    **{{anycast_range:11}}** (n1) and **{{anycast_range:12}}** (n2); each serves "hello from nX" on port 80
  - `service.{{domain}}` → {{anycast_range:1}}

  ## Steps
  1. Wait until the group is **running**, then for the members' first boot (FRR install: 1–3 min).
  2. **BGP** tab: two sessions **Established**, the anycast route with **ECMP ×2**.
  3. **Topology** tab → "Follow a packet" to see the path to the virtual IP.

  ## Checks
  - Router console: `ip route show proto bgp` lists `{{anycast_range:1}}` with two next hops
  - `for i in $(seq 10); do curl -s http://{{anycast_range:1}}/; done | sort | uniq -c` from the router hits
    both members (hash on the 5-tuple: `fib_multipath_hash_policy=1`)
  - Stop `n1` (Members tab or `systemctl stop frr` on it): the route keeps one next hop, curl still answers

  ## Things to try
  - Announce something outside {{anycast_range}} on a member (`vtysh` → `network 10.99.0.1/32`): the router
    refuses it (prefix-list), the BGP tab doesn't show it
  - Change a member's AS (`router bgp 65000`): the session stays down (router expects 64513)
  - Remove `no bgp ebgp-requires-policy` on a member: it stops sending routes (RFC 8212 default)
