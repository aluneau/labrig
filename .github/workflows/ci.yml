# Checks on every push / pull request (CLAUDE.md "Verify changes", without the e2e tests that need libvirt + VMs)
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: libvirt bindings (distro package, like the hosts)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-libvirt python3-venv
      - name: venv + dependencies
        run: |
          python3 -m venv --system-site-packages backend/venv
          grep -v '^libvirt-python' backend/requirements.txt > /tmp/req.txt
          backend/venv/bin/pip install -q -r /tmp/req.txt
      - name: Python 3.9 grammar
        run: backend/venv/bin/python scripts/check-python.py
      - name: backend imports
        run: cd backend && venv/bin/python -c "import app.main"
      - name: templates
        run: backend/venv/bin/python scripts/check-templates.py
      - name: shell scripts parse
        run: bash -n scripts/setup.sh scripts/package.sh && python3 -m py_compile scripts/vm-manager-helper scripts/vm-manager-update

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --legacy-peer-deps --no-audit --no-fund
      - run: cd frontend && npx tsc --noEmit -p .
      - run: cd frontend && CI=true npx react-scripts build

  provider:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: opentofu_provider/go.mod
          cache-dependency-path: opentofu_provider/go.sum
      - run: cd opentofu_provider && go vet ./... && go build ./...
